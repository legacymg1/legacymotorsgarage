<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Mis Finanzas — Privado</title>
<style>
  :root{ --bg:#0b0e14; --surface:#141924; --surface2:#1b2130; --border:#2a3141; --text:#e7e9ee; --muted:#9aa3b4; --gold:#f0c040; --gold2:#d9a92b; --green:#3ecf8e; --red:#e56a6a; --blue:#5b9dff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; padding-bottom:calc(30px + env(safe-area-inset-bottom)); }
  .wrap{ max-width:820px; margin:0 auto; padding:0 14px; }
  .topbar{ position:sticky; top:0; z-index:10; background:linear-gradient(180deg,#0b0e14,rgba(11,14,20,.92)); backdrop-filter:blur(6px); padding:calc(12px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border); }
  .topbar h1{ font-size:17px; margin:0; flex:1; font-weight:800; letter-spacing:.3px; } .topbar .lock{ color:var(--gold); }
  .btn{ background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 13px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn.gold{ background:var(--gold); color:#0b0e14; border-color:var(--gold); }
  .btn.sm{ padding:6px 10px; font-size:12px; }
  .btn.ghost{ background:transparent; }
  .nav{ display:flex; gap:7px; overflow-x:auto; padding:12px 0 4px; -webkit-overflow-scrolling:touch; }
  .nav button{ flex:0 0 auto; background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; }
  .nav button.on{ background:var(--gold); color:#0b0e14; border-color:var(--gold); }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; margin:12px 0; }
  .card h2{ font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .row:last-child{ border-bottom:none; }
  .row .l{ min-width:0; } .row .l b{ font-size:14px; } .row .l .s{ font-size:12px; color:var(--muted); margin-top:2px; }
  .row .r{ text-align:right; flex:0 0 auto; } .row .r b{ font-size:15px; } .row .r .s{ font-size:11px; margin-top:2px; }
  .pos{ color:var(--green); } .neg{ color:var(--red); } .mut{ color:var(--muted); }
  .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kpi{ background:var(--surface2); border:1px solid var(--border); border-radius:12px; padding:12px; }
  .kpi .t{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; } .kpi .v{ font-size:22px; font-weight:800; margin-top:4px; }
  .addbtn{ width:100%; margin-top:10px; }
  .empty{ color:var(--muted); font-size:13px; padding:8px 0; }
  .iconbtn{ background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px 6px; }
  /* modal */
  #ov{ position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; }
  #ov.on{ display:flex; }
  #sheet{ background:var(--surface); border:1px solid var(--border); border-radius:18px 18px 0 0; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }
  #sheet h3{ margin:0 0 12px; font-size:16px; }
  .fld{ margin-bottom:11px; } .fld label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:700; }
  .fld input,.fld select{ width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:11px 12px; color:var(--text); font-size:16px; outline:none; font-family:inherit; }
  .login{ max-width:360px; margin:14vh auto 0; padding:24px; text-align:center; }
  .login .logo{ font-size:42px; } .login h1{ font-size:20px; margin:8px 0 18px; }
  #app{ display:none; }
  .asof{ font-size:11px; color:var(--muted); }
  @media print{ .topbar,.nav,.addbtn,.iconbtn,.no-print,#ov{ display:none !important; } body{ background:#fff; color:#000; } .card{ border-color:#ccc; break-inside:avoid; } }
</style>
</head>
<body>

<div id="login" class="login">
  <div class="logo">🔐</div>
  <h1>Mis Finanzas — Privado</h1>
  <div class="fld"><input id="lg-email" type="email" autocomplete="username" placeholder="Correo"></div>
  <div class="fld"><input id="lg-pass" type="password" autocomplete="current-password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <button class="btn gold" style="width:100%;" onclick="doLogin()">Entrar</button>
  <div id="lg-msg" style="color:var(--red);font-size:13px;margin-top:12px;"></div>
  <div class="mut" style="font-size:11px;margin-top:18px;">Página privada. Solo el dueño.</div>
</div>

<div id="app">
  <div class="topbar">
    <span class="lock">🔒</span>
    <h1>Mis Finanzas</h1>
    <button class="btn sm ghost" onclick="refreshPrices()" id="px-btn">🔄 Precios</button>
    <button class="btn sm ghost" onclick="logout()">Salir</button>
  </div>
  <div class="wrap">
    <div class="nav" id="nav"></div>
    <div id="view"></div>
  </div>
</div>

<div id="ov" onclick="if(event.target===this)closeSheet()"><div id="sheet"></div></div>

<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";

const firebaseConfig = { apiKey:"AIzaSyDrCMJQclGosVp3EV49vmwKDnji-Oti5j0", authDomain:"legacy-motors-garage.firebaseapp.com", projectId:"legacy-motors-garage", storageBucket:"legacy-motors-garage.firebasestorage.app", messagingSenderId:"783567672493", appId:"1:783567672493:web:3a825f2f59ec1c25e9a224" };
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const functions=getFunctions(app);
const OWNER='ev@legacymotorsgarage.com';
const REF=doc(db,'private_finance','ev');

const CG={ BTC:'bitcoin', ETH:'ethereum', SOL:'solana', DOGE:'dogecoin', ADA:'cardano', XRP:'ripple', BNB:'binancecoin', LTC:'litecoin', MATIC:'matic-network', AVAX:'avalanche-2', DOT:'polkadot', LINK:'chainlink', SHIB:'shiba-inu' };
const DEF={ crypto:[], stocks:[], cash:0, cards:[], insurance:[], expenses:[], income:[], coRevenue:[], coExpenses:[], debtExtra:0, plaidIgnore:[], cardPromo:{}, cardApr:{} };
let D=JSON.parse(JSON.stringify(DEF)), prices={crypto:{},stocks:{},at:''}, section='resumen', unsub=null;
let plaid={ items:[], totals:{cash:0,cardDebt:0,invest:0}, at:'' };

const uid=()=> 'x'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);
const num=(v)=>{ const n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const fmt=(n)=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=(n)=>'$'+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const fmtD=(d)=>{ if(!d) return '—'; const x=new Date(String(d)+'T00:00:00'); return isNaN(x)?String(d):x.toLocaleDateString('es-MX',{day:'numeric',month:'short'}); };
const esc=(s)=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const sum=(arr,k)=>(arr||[]).reduce((a,x)=>a+num(x[k]),0);

// ---------- AUTH ----------
window.doLogin=async function(){
  const em=(document.getElementById('lg-email').value||'').trim(), pw=document.getElementById('lg-pass').value||'';
  document.getElementById('lg-msg').textContent='';
  try{ await signInWithEmailAndPassword(auth,em,pw); }
  catch(e){ document.getElementById('lg-msg').textContent='Correo o contraseña incorrectos.'; }
};
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,(user)=>{
  const em=((user&&user.email)||'').toLowerCase();
  if(user && em===OWNER){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    start();
  }else{
    if(user && em!==OWNER){ document.getElementById('lg-msg').textContent='Esta cuenta no tiene acceso.'; signOut(auth); }
    document.getElementById('login').style.display='block';
    document.getElementById('app').style.display='none';
    if(unsub){ unsub(); unsub=null; }
  }
});
function start(){
  if(unsub) return;
  unsub=onSnapshot(REF,(snap)=>{
    const d=snap.exists()?snap.data():{};
    D=Object.assign(JSON.parse(JSON.stringify(DEF)), d);
    for(const k in DEF){ if(!Array.isArray(D[k]) && Array.isArray(DEF[k])) D[k]=DEF[k].slice(); }
    render();
  },(e)=>{ console.warn('finance',e); });
  buildNav();
  refreshPrices();
  plaidSyncNow(true);
}
async function save(){ try{ await setDoc(REF, D); }catch(e){ alert('No se pudo guardar: '+e.message); } }

// ---------- PRICES ----------
window.refreshPrices=async function(){
  const btn=document.getElementById('px-btn'); if(btn) btn.textContent='…';
  try{
    const cg=[...new Set(D.crypto.map(c=>c.cgId).filter(Boolean))];
    const sy=[...new Set(D.stocks.map(s=>(s.symbol||'').toUpperCase()).filter(Boolean))];
    if(cg.length||sy.length){ const r=await httpsCallable(functions,'marketQuotes')({crypto:cg,stocks:sy}); prices=r.data||prices; }
  }catch(e){ /* precios no disponibles ahora */ }
  if(btn) btn.textContent='🔄 Precios';
  render();
};
const cgPrice=(c)=> prices.crypto[c.cgId] || 0;
const syPrice=(s)=> prices.stocks[(s.symbol||'').toUpperCase()] || 0;

// ---------- PLAID (cuentas reales) ----------
async function plaidSyncNow(silent){
  try{ const r=await httpsCallable(functions,'plaidSync')({}); if(r&&r.data) plaid=r.data; }
  catch(e){ if(!silent) alert('Plaid: '+((e&&e.message)||e)); }
  render();
}
window.plaidSyncNow=plaidSyncNow;
window.plaidConnect=async function(kind){
  if(typeof Plaid==='undefined'){ alert('Cargando Plaid… intenta de nuevo en un segundo.'); return; }
  const owner = confirm('¿Esta cuenta es de tu ESPOSA?\n\nAceptar = de ella  ·  Cancelar = tuya') ? 'ella' : 'yo';
  try{
    const r=await httpsCallable(functions,'plaidLinkToken')({kind});
    const token=r&&r.data&&r.data.link_token; if(!token) throw new Error('sin token');
    const handler=Plaid.create({
      token,
      onSuccess: async (public_token, metadata)=>{
        try{
          await httpsCallable(functions,'plaidExchange')({ public_token, kind, owner, institution:(metadata&&metadata.institution&&metadata.institution.name)||'' });
          await plaidSyncNow(true);
          alert('✅ Cuenta conectada');
        }catch(e){ alert('No se pudo conectar: '+((e&&e.message)||e)); }
      },
      onExit: ()=>{}
    });
    handler.open();
  }catch(e){ alert('Plaid: '+((e&&e.message)||e)); }
};
window.plaidToggleOwner=async function(itemId, newOwner){
  try{ await httpsCallable(functions,'plaidSetOwner')({ itemId, owner:newOwner }); await plaidSyncNow(true); }
  catch(e){ alert('Plaid: '+((e&&e.message)||e)); }
};
window.plaidUnlink=async function(itemId){
  if(!confirm('¿Desconectar esta cuenta?')) return;
  try{ await httpsCallable(functions,'plaidRemove')({itemId}); await plaidSyncNow(true); }
  catch(e){ alert('Plaid: '+((e&&e.message)||e)); }
};
// clave estable por cuenta (login + últimos 4 + tipo + nombre) para poder ignorar duplicadas
function accKey(itemId, a){ return itemId+'|'+(a.mask||'')+'|'+(a.type||'')+'|'+(a.name||''); }
function isIgnored(key){ return (D.plaidIgnore||[]).indexOf(key)>=0; }
window.toggleIgnoreAcc=async function(kEnc){
  const key=decodeURIComponent(kEnc); D.plaidIgnore=D.plaidIgnore||[];
  const i=D.plaidIgnore.indexOf(key); if(i>=0) D.plaidIgnore.splice(i,1); else D.plaidIgnore.push(key);
  await save();
};
// recalcula totales de Plaid EXCLUYENDO las cuentas marcadas como duplicadas
function plaidTotals(){
  let cash=0, cardDebt=0, invest=0;
  (plaid.items||[]).forEach(it=>(it.accounts||[]).forEach(a=>{
    if(isIgnored(accKey(it.itemId,a))) return;
    const b=num(a.balance);
    if(a.type==='depository') cash+=b;
    else if(a.type==='credit') cardDebt+=b;
    else if(a.type==='investment'||a.type==='brokerage') invest+=b;
  }));
  return {cash,cardDebt,invest};
}
// tarjetas de crédito conectadas por Plaid, normalizadas para la estrategia de deuda
function plaidCards(){
  const out=[];
  (plaid.items||[]).forEach(it=>(it.accounts||[]).forEach(a=>{
    if(a.type!=='credit') return; const key=accKey(it.itemId,a); if(isIgnored(key)) return;
    const promo=(D.cardPromo&&D.cardPromo[key])||{};
    out.push({ id:'plaid:'+key, name:(a.name||'Tarjeta')+(a.mask?(' ••'+a.mask):''), balance:num(a.balance), apr:num(a.apr), minPayment:num(a.minPayment), promoUntil:promo.until||'', limit:0, _plaid:true, _key:key });
  }));
  return out;
}
function allDebtCards(){ return plaidCards().concat((D.cards||[]).map(k=>Object.assign({_plaid:false},k))); }
window.setCardPromo=async function(kEnc){
  const key=decodeURIComponent(kEnc); const cur=(D.cardPromo&&D.cardPromo[key]&&D.cardPromo[key].until)||'';
  const v=prompt('¿Hasta qué fecha tiene promo 0% esta tarjeta? (AAAA-MM-DD)\nDéjalo vacío para quitar la promo.', cur);
  if(v==null) return; D.cardPromo=D.cardPromo||{};
  if(String(v).trim()) D.cardPromo[key]={until:String(v).trim()}; else delete D.cardPromo[key];
  await save();
};
window.setCardApr=async function(kEnc){
  const key=decodeURIComponent(kEnc); const cur=(D.cardApr&&D.cardApr[key])||'';
  const v=prompt('¿Cuál es el APR REAL de esta tarjeta? (%)\nEjemplo: 24.99\n\n(El banco no lo mandó por Plaid; ponlo a mano para que el cálculo salga bien.)', cur);
  if(v==null) return; D.cardApr=D.cardApr||{};
  if(String(v).trim()) D.cardApr[key]=num(v); else delete D.cardApr[key];
  await save();
};

function vConectar(){
  const t=plaidTotals();
  const dupMap={}; (plaid.items||[]).forEach(it=>(it.accounts||[]).forEach(a=>{ const kk=(a.type||'')+'|'+(a.mask||''); dupMap[kk]=(dupMap[kk]||0)+1; }));
  const itemsHtml=(plaid.items&&plaid.items.length)?plaid.items.map(it=>{
    const accs=(it.accounts||[]).map(a=>{
      const key=accKey(it.itemId,a), ign=isIgnored(key), kEnc=encodeURIComponent(key).replace(/'/g,'%27');
      const due=a.dueDate?(' · 📆 vence '+esc(a.dueDate)):'';
      const cls=ign?'mut':(a.type==='credit'?'neg':((a.type==='depository'||a.type==='investment'||a.type==='brokerage')?'pos':''));
      const dup=(dupMap[(a.type||'')+'|'+(a.mask||'')]>1);
      const dupHint=dup?' · <span class="mut">🔁 en 2 logins</span>':'';
      const ignNote=ign?' · <b class="mut">no se cuenta (duplicada)</b>':'';
      const btn=`<button class="btn ghost sm" style="margin-top:5px;" onclick="toggleIgnoreAcc('${kEnc}')">${ign?'✔️ Contar':'🚫 No contar'}</button>`;
      return `<div class="row" style="${ign?'opacity:.55;':''}"><div class="l"><b>${esc(a.name||a.type)}${a.mask?(' ••'+esc(a.mask)):''}</b><div class="s">${esc(a.subtype||a.type)}${due}${a.apr?(' · '+esc(a.apr)+'% APR'):''}${dupHint}${ignNote}</div>${dup?btn:''}</div><div class="r"><b class="${cls}">${fmt(a.balance)}</b></div></div>`;
    }).join('');
    const own=(it.owner==='ella');
    return `<div class="card"><h2>🏦 ${esc(it.institution||'Cuenta')}<button class="btn ghost sm" style="margin-left:auto;" onclick="plaidToggleOwner('${it.itemId}','${own?'yo':'ella'}')">${own?'👩 Esposa':'👤 Tú'}</button><button class="iconbtn" style="color:#e57373;" onclick="plaidUnlink('${it.itemId}')">✕</button></h2>${accs||'<div class="empty">Sin cuentas.</div>'}${it.error?('<div class="s neg" style="margin-top:4px;">⚠️ '+esc(it.error)+'</div>'):''}</div>`;
  }).join(''):`<div class="card"><div class="empty">Aún no conectas ninguna cuenta. Toca un botón de arriba para empezar.</div></div>`;
  return `
  <div class="card">
    <h2>🔗 Conectar cuentas reales</h2>
    <div class="s mut" style="margin-bottom:10px;">Conecta tus bancos, tarjetas y Robinhood para que se actualicen solos. Tus contraseñas NUNCA pasan por aquí.</div>
    <button class="btn gold" style="width:100%;margin-bottom:8px;" onclick="plaidConnect('bank')">🏦 Conectar banco / tarjeta</button>
    <button class="btn" style="width:100%;margin-bottom:8px;" onclick="plaidConnect('investments')">📈 Conectar inversión (Robinhood)</button>
    <button class="btn" style="width:100%;" onclick="plaidConnect('card')">💳 Tarjeta que no jaló arriba (solo saldo)</button>
    <button class="btn ghost sm" style="width:100%;margin-top:10px;" onclick="plaidSyncNow()">🔄 Actualizar saldos</button>
    <div class="asof" style="margin-top:8px;">${plaid.at?('Actualizado '+new Date(plaid.at).toLocaleString('es-MX')):'Toca actualizar para traer saldos'}</div>
  </div>
  <div class="kpis" style="margin:12px 0;">
    <div class="kpi"><div class="t">Efectivo conectado</div><div class="v pos">${fmt0(t.cash)}</div></div>
    <div class="kpi"><div class="t">Inversiones conectadas</div><div class="v">${fmt0(t.invest)}</div></div>
    <div class="kpi"><div class="t">Deuda tarjetas conectadas</div><div class="v neg">${fmt0(t.cardDebt)}</div></div>
    <div class="kpi"><div class="t">Cuentas conectadas</div><div class="v">${(plaid.items||[]).length}</div></div>
  </div>
  ${itemsHtml}
  <div class="card"><div class="s mut">💡 Para no contar doble: lo que conectes aquí NO lo metas también a mano en Tarjetas / Efectivo / Acciones.</div></div>`;
}

// ---------- CALCS ----------
function calc(){
  const cryptoVal=D.crypto.reduce((a,c)=>a+num(c.amount)*(cgPrice(c)||num(c.buyPrice)),0);
  const cryptoCost=D.crypto.reduce((a,c)=>a+num(c.amount)*num(c.buyPrice),0);
  const stockVal=D.stocks.reduce((a,s)=>a+num(s.shares)*(syPrice(s)||num(s.buyPrice)),0);
  const stockCost=D.stocks.reduce((a,s)=>a+num(s.shares)*num(s.buyPrice),0);
  const invVal=cryptoVal+stockVal, invCost=cryptoCost+stockCost;   // manual (para ganancia/pérdida)
  const pt=plaidTotals(); const plaidCash=num(pt.cash), plaidInvest=num(pt.invest), plaidDebt=num(pt.cardDebt);
  const cash=num(D.cash)+plaidCash;
  const debt=sum(D.cards,'balance')+plaidDebt;
  const invTotal=invVal+plaidInvest;
  const assets=cash+invTotal;
  const net=assets-debt;
  const income=sum(D.income,'amount');
  const expenses=sum(D.expenses,'amount')+sum(D.insurance,'premium');
  const monthly=income-expenses;
  const coRev=sum(D.coRevenue,'amount'), coExp=sum(D.coExpenses,'amount');
  return { cryptoVal,cryptoCost,stockVal,stockCost,invVal,invCost,invTotal,plaidCash,plaidInvest,plaidDebt,cash,debt,assets,net,income,expenses,monthly,coRev,coExp,coNet:coRev-coExp };
}

// ---------- NAV / RENDER ----------
const SECTIONS=[['resumen','📊 Resumen'],['deuda','💳 Deuda'],['conectar','🔗 Conectar'],['crypto','₿ Cripto'],['stocks','📈 Acciones'],['cards','💳 Tarjetas'],['insurance','🛡️ Seguro'],['expenses','🧾 Gastos'],['income','💰 Ingresos'],['company','🏢 Empresa']];
function buildNav(){ document.getElementById('nav').innerHTML=SECTIONS.map(([k,l])=>`<button data-k="${k}" class="${k===section?'on':''}" onclick="go('${k}')">${l}</button>`).join(''); }
window.go=(k)=>{ section=k; buildNav(); render(); window.scrollTo(0,0); };

function render(){ const v=document.getElementById('view'); if(!v) return; v.innerHTML=({resumen:vResumen,deuda:vDebt,conectar:vConectar,crypto:vCrypto,stocks:vStocks,cards:vCards,insurance:vInsurance,expenses:vExpenses,income:vIncome,company:vCompany}[section]||vResumen)(); }

function rowsHtml(list, mapFn, addLabel, addKey){
  const body = list.length ? list.map(mapFn).join('') : `<div class="empty">Nada todavía.</div>`;
  return body + `<button class="btn gold sm addbtn" onclick="addRow('${addKey}')">➕ ${addLabel}</button>`;
}
function itemRow(sec, it, main, sub, right, rightSub){
  return `<div class="row"><div class="l"><b>${main}</b><div class="s">${sub||''}</div></div>
    <div class="r"><b>${right||''}</b><div class="s mut">${rightSub||''}</div>
      <div style="margin-top:2px;"><button class="iconbtn" onclick="editRow('${sec}','${it.id}')">✏️</button><button class="iconbtn" onclick="delRow('${sec}','${it.id}')">🗑️</button></div>
    </div></div>`;

// ---- DEUDA (estrategia) ----
function daysUntil(dateStr){ if(!dateStr) return null; const d=new Date(dateStr+'T00:00:00'); if(isNaN(d)) return null; const n=new Date(); n.setHours(0,0,0,0); return Math.round((d-n)/86400000); }
function cardMin(k){ const bal=num(k.balance); if(bal<=0) return 0; const m=num(k.minPayment); return m>0?m:Math.max(25, bal*0.02); }
function cardApr(k){ if(k._plaid){ const o=(D.cardApr||{})[k._key]; if(o!=null && String(o).trim()!=='') return num(o); } return num(k.apr); } // override manual gana
function effApr(k){ const du=daysUntil(k.promoUntil); return (du!=null && du>0)?0:cardApr(k); } // promo 0% vigente = 0
function aprUnknown(k){ const du=daysUntil(k.promoUntil); if(du!=null && du>0) return false; return cardApr(k)<=0; } // Plaid no dio APR y no es promo
function simulatePayoff(list, extra){
  let cs=(list||[]).map(k=>({bal:num(k.balance), r:effApr(k)/1200, min:cardMin(k)})).filter(c=>c.bal>0.005);
  if(!cs.length) return {months:0,interest:0,unpayable:false,budget:0};
  const budget=cs.reduce((a,c)=>a+c.min,0)+Math.max(0,num(extra));
  const interestNow=cs.reduce((a,c)=>a+c.bal*c.r,0);
  if(budget<=interestNow+0.01) return {months:0,interest:0,unpayable:true,budget};
  let months=0, interest=0;
  while(cs.some(c=>c.bal>0.005) && months<1200){
    months++;
    cs.forEach(c=>{ const i=c.bal*c.r; c.bal+=i; interest+=i; });      // interés del mes
    let rem=budget;
    cs.forEach(c=>{ const pay=Math.min(c.min,c.bal); c.bal-=pay; rem-=pay; }); // mínimos
    cs.sort((a,b)=> b.r-a.r || b.bal-a.bal);                          // avalancha: al APR más alto
    for(const c of cs){ if(rem<=0.005) break; if(c.bal>0){ const pay=Math.min(rem,c.bal); c.bal-=pay; rem-=pay; } }
  }
  return {months, interest, unpayable:false, budget};
}

function futureDate(months){ const d=new Date(); d.setMonth(d.getMonth()+Math.max(0,months)); return d.toLocaleDateString('es-MX',{month:'short',year:'numeric'}); }
function vDebt(){
  const ALL=allDebtCards();
  const cards=ALL.filter(k=>num(k.balance)>0);
  if(!cards.length) return `<div class="card"><h2>💳 Estrategia de deuda</h2><div class="empty">No hay tarjetas con saldo.<br>Conéctalas en <b>🔗 Conectar</b> (jalan saldo, APR y pago mínimo solitas) o agrégalas a mano en <b>💳 Tarjetas</b>.</div></div>`;
  const totalDebt=cards.reduce((a,k)=>a+num(k.balance),0), totalLimit=ALL.reduce((a,k)=>a+num(k.limit),0);
  const util=totalLimit>0?(totalDebt/totalLimit*100):0;
  const monthlyInterest=cards.reduce((a,k)=>a+num(k.balance)*effApr(k)/1200,0);
  const wApr=totalDebt>0?cards.reduce((a,k)=>a+num(k.balance)*cardApr(k),0)/totalDebt:0;
  const order=[...cards].sort((a,b)=> effApr(b)-effApr(a) || num(b.balance)-num(a.balance));
  const attack=order.find(k=>effApr(k)>0);
  const promos=cards.map(k=>({k,du:daysUntil(k.promoUntil)})).filter(x=>x.du!=null && x.du>0).sort((a,b)=>a.du-b.du);

  const orderHtml=order.map((k)=>{
    const e=effApr(k), mi=num(k.balance)*e/1200, isAttack=(attack && k.id===attack.id), promo=(daysUntil(k.promoUntil)>0), unknown=aprUnknown(k);
    const kEnc=k._plaid?encodeURIComponent(k._key).replace(/'/g,'%27'):'';
    const aprLabel=promo?`<span class="pos">0% (promo)</span>`:(unknown?`<span class="neg">APR ? — ponlo 👉</span>`:`${e.toFixed(1)}% APR`);
    const aprBtn=k._plaid?`<button class="iconbtn" title="Poner APR real" onclick="setCardApr('${kEnc}')">✏️</button>`:'';
    const promoBtn=k._plaid?`<button class="iconbtn" title="Marcar/quitar promo 0%" onclick="setCardPromo('${kEnc}')">🎁</button>`:'';
    return `<div class="row" style="${isAttack?'background:rgba(240,192,64,.08);border-radius:10px;padding:10px 8px;':''}">
      <div class="l"><b>${isAttack?'🎯 ':''}${esc(k.name)}</b><div class="s">${aprLabel}${mi>0?(' · interés ~'+fmt(mi)+'/mes'):''}${isAttack?' · <b>ataca esta primero</b>':''}</div></div>
      <div class="r"><b class="neg">${fmt(num(k.balance))}</b>${aprBtn}${promoBtn}</div></div>`;
  }).join('');
  const unknownCount=cards.filter(aprUnknown).length;
  const warnBanner=unknownCount?`<div class="card" style="border-color:var(--red);"><div class="s neg">⚠️ ${unknownCount} tarjeta(s) sin APR — el banco no lo mandó. Tócales el ✏️ y pon su APR real para que el interés y el orden salgan correctos.</div></div>`:'';

  const promoHtml=promos.length?promos.map(({k,du})=>{
    const jump=cardApr(k), afterInt=num(k.balance)*jump/1200, warn=(du<=60);
    return `<div class="row"><div class="l"><b>🎁 ${esc(k.name)}</b><div class="s">0% termina en <b class="${warn?'neg':''}">${du} días</b> (${esc(k.promoUntil)})${jump?(' · luego '+jump.toFixed(1)+'% APR'):''}</div>${warn&&jump?`<div class="s neg">⚠️ Bájala antes de que expire — al terminar le pega ~${fmt(afterInt)}/mes de interés</div>`:''}</div><div class="r"><b class="neg">${fmt(num(k.balance))}</b></div></div>`;
  }).join(''):'<div class="empty">Ninguna tarjeta en promo 0% capturada.</div>';

  const extra=num(D.debtExtra), base=simulatePayoff(cards,0), plan=simulatePayoff(cards,extra);
  let planHtml;
  if(plan.unpayable){
    planHtml=`<div class="s neg">⚠️ Con ${fmt(plan.budget)}/mes la deuda casi no baja — el interés se la come. Necesitas apartar más al mes para poder salir.</div>`;
  }else{
    const saveInt=Math.max(0,base.interest-plan.interest), saveMo=Math.max(0,base.months-plan.months);
    planHtml=`<div class="row"><div class="l"><b>Pagando ${fmt(plan.budget)}/mes</b><div class="s">mínimos ${fmt(Math.max(0,plan.budget-extra))} + extra ${fmt(extra)}</div></div><div class="r"><b>${plan.months} meses</b><div class="s mut">~${futureDate(plan.months)}</div></div></div>
    <div class="row"><div class="l"><b>Interés total que pagarás</b></div><div class="r"><b class="neg">${fmt(plan.interest)}</b></div></div>
    ${extra>0?`<div class="row"><div class="l"><b class="pos">Con ese extra ahorras</b><div class="s">vs. pagar solo mínimos</div></div><div class="r"><b class="pos">${fmt(saveInt)}</b><div class="s pos">${saveMo} meses antes</div></div></div>`:`<div class="s mut">💡 Toca "✏️ Extra" y pon cuánto puedes echarle de más al mes para ver en cuánto sales de deudas y cuánto ahorras.</div>`}`;
  }

  return `
  <div class="kpis">
    <div class="kpi"><div class="t">Deuda total</div><div class="v neg">${fmt0(totalDebt)}</div></div>
    <div class="kpi"><div class="t">Interés al mes</div><div class="v neg">${fmt0(monthlyInterest)}</div></div>
    <div class="kpi"><div class="t">APR promedio</div><div class="v">${wApr.toFixed(1)}%</div></div>
    <div class="kpi"><div class="t">Uso del crédito</div><div class="v ${util>30?'neg':''}">${util?util.toFixed(0)+'%':'—'}</div></div>
  </div>
  ${warnBanner}
  <div class="card">
    <h2>🪜 Orden para pagar (avalancha)</h2>
    <div class="s mut" style="margin-bottom:8px;">Paga el mínimo de todas y échale todo lo extra a la de <b>APR más alto</b> primero. Es lo que menos interés te cuesta.</div>
    ${orderHtml}
  </div>
  <div class="card">
    <h2>🎁 Promociones 0%</h2>
    ${promoHtml}
  </div>
  <div class="card">
    <h2>🏁 ¿En cuánto sales de deudas?<button class="btn ghost sm" style="margin-left:auto;" onclick="editDebtExtra()">✏️ Extra</button></h2>
    ${planHtml}
  </div>
  <div class="card"><div class="s mut">Es matemática general para orientarte, no consejo financiero — las decisiones finales las tomas tú (o con tu contador). El pago mínimo se estima en 2% del saldo si no lo capturas por tarjeta.</div></div>`;
}

function connCardHtml({it,a,key}){
  const kEnc=encodeURIComponent(key).replace(/'/g,'%27');
  const promoUntil=(D.cardPromo&&D.cardPromo[key]&&D.cardPromo[key].until)||'';
  const du=daysUntil(promoUntil), promoOn=(du!=null && du>0);
  const aprOv=(D.cardApr||{})[key], apr=(aprOv!=null && String(aprOv).trim()!=='')?num(aprOv):num(a.apr);
  const util=(num(a.limit)>0)?(num(a.balance)/num(a.limit)*100):0;
  let aprCell;
  if(promoOn) aprCell=`<span class="pos">0% — promo hasta ${fmtD(promoUntil)} (${du} días)</span>`;
  else if(a.promoApr===0) aprCell=`<span class="pos">0% detectado</span> · <span class="neg">¿hasta cuándo? 🎁</span>`;
  else if(apr>0) aprCell=`${apr.toFixed(2)}%`;
  else aprCell=`<span class="neg">falta ponerlo ✏️</span>`;
  const detail=[
    ['📅 Fecha de corte', fmtD(a.stmtCloseDate)],
    ['💳 Fecha de pago', fmtD(a.dueDate)],
    ['🚫 Paga sin generar intereses', a.stmtBalance!=null?fmt(a.stmtBalance):'—'],
    ['🔻 Pago mínimo', (a.minPayment!==''&&a.minPayment!=null)?fmt(a.minPayment):'—'],
    ['💠 APR (compra)', aprCell],
  ].map(([l,v])=>`<div class="row"><div class="l"><b>${l}</b></div><div class="r"><b>${v}</b></div></div>`).join('');
  const last=(a.lastPayAmount!=null)?`<div class="s mut" style="margin-top:6px;">Último pago: ${fmt(a.lastPayAmount)}${a.lastPayDate?(' · '+fmtD(a.lastPayDate)):''}</div>`:'';
  const over=a.isOverdue?`<div class="s neg" style="margin-top:4px;">⚠️ Pago vencido</div>`:'';
  return `<div class="card">
    <h2>💳 ${esc(a.name||'Tarjeta')}${a.mask?(' ••'+esc(a.mask)):''}<span class="asof" style="margin-left:auto;font-weight:400;">${esc(it.institution||'')}</span></h2>

  </div>`;
}

  const flds=FIELDS[sec]||[]; const obj={ id: id||uid() };
  flds.forEach(([k])=>{ obj[k]=(document.getElementById('f-'+k).value||'').trim(); });
  if(sec==='crypto'){ const tk=(obj.coin||'').toUpperCase(); obj.cgId=CG[tk]||(obj.coin||'').toLowerCase().replace(/\s+/g,'-'); }
  if(sec==='stocks'){ obj.symbol=(obj.symbol||'').toUpperCase(); }
  D[sec]=D[sec]||[];
  if(id){ const i=D[sec].findIndex(x=>x.id===id); if(i>=0) D[sec][i]=obj; else D[sec].push(obj); } else D[sec].push(obj);
  await save(); closeSheet(); refreshPrices();
};
</script>
